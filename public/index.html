<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Dinamica - Autenticazione</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="form-header">
            <h2 id="form-title">Accedi alla Mappa</h2>
            <p id="form-subtitle">Inserisci le tue credenziali per caricare i tuoi dati salvati</p>
        </div>

        <form id="auth-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Inserisci il tuo username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Inserisci la tua password">
            </div>

            <button type="submit" id="submit-btn" class="btn primary">Accedi</button>
        </form>

        <div class="toggle-mode">
            <span id="toggle-text">Non hai un account?</span>
            <a href="#" id="toggle-btn">Registrati</a>
        </div>

        <div id="auth-message" class="auth-message"></div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
